name: Publish job snapshot

# Why: Render's free tier has no persistent disk, so the server starts empty after every deploy/restart.
# This workflow crawls the job boards and publishes a database snapshot as a release asset; the server
# downloads it on boot (backend/app/snapshot.py) and serves jobs in seconds instead of re-crawling.
# To stop it: disable this workflow in the repo's Actions tab, or delete this file.
on:
  schedule:
    - cron: "17 */4 * * *"        # every 4 hours
  workflow_dispatch: {}

permissions:
  contents: write                  # create/update the "snapshot" release

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Crawl and export
        env:
          DATABASE_PATH: ${{ runner.temp }}/jobly.db
          SNAPSHOT_REPO: ""        # don't try to restore while building
          CRAWL_PROFILE: full      # read everything here, so the free server doesn't have to (it restores this snapshot)
        run: python -m backend.app.snapshot build jobly.db.gz
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view snapshot >/dev/null 2>&1 || gh release create snapshot --title "Job snapshot" --notes "Automated database snapshot used to warm-start the server. Replaced on every run." --latest=false
          gh release upload snapshot jobly.db.gz --clobber
